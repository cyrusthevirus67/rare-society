<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members — The Rare Society</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/society.css?v=3">
</head>
<body class="app">
  <header class="appbar">
    <a href="/" class="brand" aria-label="The Rare Society home"><img src="/assets/mark.png" alt="" width="240" height="169"><span>The Rare <b>Society</b></span></a>
    <nav class="appbar__links" aria-label="Members">
      <button type="button" class="appbar__lessons" id="lessons-btn" aria-controls="side" aria-expanded="false">Lessons</button>
      <a href="#home" data-route="home">Home</a>
      <a href="#account" data-route="account">Account</a>
      <a href="/admin" id="admin-link" data-demo-link hidden>Admin</a>
      <button type="button" id="signout">Sign out</button>
    </nav>
  </header>
  <div class="demo-bar" id="demo-bar" hidden>Preview mode — sample lessons. Nothing you do here is saved.</div>
  <div class="app__grid" id="grid">
    <aside class="side" id="side" aria-label="Course lessons" hidden></aside>
    <div class="scrim" id="scrim"></div>
    <main class="stage" id="stage"><div class="stage__inner"><p class="loading">Loading your course…</p></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js?v=2"></script>
  <script src="/core.js?v=2"></script>
  <script src="/learn.js?v=1"></script>
</body>
</html>
