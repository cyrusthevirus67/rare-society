<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/society.css?v=2">
  <title>Member login — The Rare Society</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <header class="nav nav--solid">
    <div class="wrap nav__inner">
      <a href="/" class="brand" aria-label="The Rare Society home"><img src="/assets/mark.png" alt="" width="240" height="169"><span>The Rare <b>Society</b></span></a>
    </div>
  </header>
  <main class="solo">
    <form class="solo__card" id="signin" novalidate>
      <p class="label" style="margin:0">Members</p>
      <h1>Welcome <em>back.</em></h1>
      <p>Enter the email you joined with and we’ll send you a one-time sign-in link. No password needed.</p>
      <label class="field"><span class="sr-only">Email</span><input name="email" type="email" autocomplete="email" placeholder="you@email.com" required></label>
      <button class="btn btn--red btn--block" type="submit">Email me a sign-in link <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
      <p class="msg" role="status" aria-live="polite"></p>
      <p class="solo__small">Not a member yet? <a href="/#pricing">Join The Rare Society</a></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js?v=4"></script>
  <script src="/core.js?v=2"></script>
  <script>
    (() => {
      const { api, configured, DEMO, CFG, href } = window.RS;
      const form = document.getElementById("signin");
      const msg = form.querySelector(".msg");
      if (configured && !DEMO) api.session().then((s) => { if (s) location.replace("/learn"); }).catch(() => {});
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = form.elements.email.value.trim().toLowerCase();
        msg.className = "msg";
        if (!email || !form.elements.email.checkValidity()) { msg.textContent = "Please enter a valid email."; msg.classList.add("is-error"); return; }
        if (DEMO) { location.href = href("/learn"); return; }
        if (!configured) { msg.textContent = `Sign-in isn’t available right now. Email ${CFG.email}.`; msg.classList.add("is-error"); return; }
        const btn = form.querySelector("button");
        btn.disabled = true; msg.textContent = "Sending…";
        try {
          await api.sendLink(email);
          msg.textContent = `Check ${email} — your sign-in link is on its way. Open it on this device.`;
          msg.classList.add("is-ok");
        } catch {
          msg.textContent = "We couldn’t send the link. Wait a minute and try again.";
          msg.classList.add("is-error");
        } finally { btn.disabled = false; }
      });
    })();
  </script>
</body>
</html>
